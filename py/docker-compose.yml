services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gatepass
      POSTGRES_USER: gatepass
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - gatepass-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatepass -d gatepass"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://gatepass:${POSTGRES_PASSWORD}@postgres:5432/gatepass
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?Set DATA_ENCRYPTION_KEY in .env}
      IDENTIFIER_HMAC_KEY: ${IDENTIFIER_HMAC_KEY:?Set IDENTIFIER_HMAC_KEY in .env}
      SESSION_HMAC_KEY: ${SESSION_HMAC_KEY:?Set SESSION_HMAC_KEY in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      READER_MODE: ${READER_MODE:-mock}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  gatepass-postgres:
